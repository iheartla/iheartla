on:
  push:
    branches:
      - 'mesh'

name: Run test cases

jobs:
  build:
    name: Run test cases
    # cppyy-cling 6.32's Cling can't parse the Xcode 26.x SDK headers on macos-26; macos-15 (Xcode 16) works
    runs-on: macos-15
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # zstd is needed by the cppyy-cling wheel (see below)
      - run: brew install zstd
      # Generated C++ needs Eigen 3.4 and autodiff (via type_helper.h)
      - run: sh test/fetch_deps.sh
      - run: python -m pip install --upgrade pip
      - run: pip install setuptools attrdict
      - run: pip install wheel pyinstaller regex "tatsu>=5.8.3,<5.15" wxpython PyMuPDF sympy appdirs cppyy numpy scipy
      # The cppyy-cling 6.32.8 macOS arm64 wheel links against MacPorts' /opt/local/lib/libzstd.1.dylib.
      # Point it at Homebrew's zstd instead (no-op if the wheel doesn't reference that path).
      - name: Fix cppyy-cling libzstd path
        run: PYTHON=python sh test/fix_cppyy_zstd.sh
      - run: python -c "import cppyy"
      - run: sh run_test.sh
