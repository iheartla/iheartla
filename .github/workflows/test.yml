on:
  push:
    branches:
      - 'mesh'

name: Run test cases

jobs:
  build:
    name: Run test cases
    # cppyy-cling 6.32's Cling can't parse the Xcode 26.x SDK headers on macos-26; macos-15 (Xcode 16) works
    runs-on: macos-15
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Generated C++ includes type_helper.h, which needs autodiff.
      # autodiff 1.1.2 is incompatible with Eigen 5, so use eigen@3 (keg-only).
      # zstd is needed by the cppyy-cling wheel (see below).
      - run: brew install eigen@3 autodiff zstd
      - run: python -m pip install --upgrade pip
      - run: pip install setuptools attrdict
      - run: pip install wheel pyinstaller regex tatsu==5.7.3 wxpython PyMuPDF sympy appdirs cppyy numpy scipy
      # The cppyy-cling 6.32.8 macOS arm64 wheel links against MacPorts' /opt/local/lib/libzstd.1.dylib.
      # Point it at Homebrew's zstd instead (no-op if the wheel doesn't reference that path).
      - name: Fix cppyy-cling libzstd path
        run: |
          LIB=$(python -c "import cppyy_backend, os; print(os.path.join(os.path.dirname(cppyy_backend.__file__), 'lib', 'libCling.so'))")
          if otool -L "$LIB" | grep -q /opt/local/lib/libzstd.1.dylib; then
            install_name_tool -change /opt/local/lib/libzstd.1.dylib "$(brew --prefix zstd)/lib/libzstd.1.dylib" "$LIB"
            codesign -f -s - "$LIB"
          fi
      - run: python -c "import cppyy"
      - run: sh run_test.sh
        env:
          EIGEN_PATH: /opt/homebrew/opt/eigen@3/include/eigen3
