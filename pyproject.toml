[project]
name = "iheartla"
version = "0.0.1"
description = "I❤️LA: Compilable Markdown for Linear Algebra"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yong Li", email = "pressure36@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    # The grammar needs the `regex` module; iheartla/__init__.py makes TatSu
    # use it. TatSu 5.15 removed exceptions iheartla imports (FailedCut).
    "tatsu>=5.8.3,<5.15",
    "regex",
    "sympy",
    "appdirs",
]

[project.scripts]
iheartla = "iheartla.__main__:main"

[project.optional-dependencies]
gui = ["wxpython", "PyMuPDF"]
viz = ["graphviz"]
# (autograd: generated NumPy code with derivatives, ∂f/∂x, uses it)
test = ["numpy", "scipy", "cppyy", "autograd"]
# the MATLAB checks in GNU Octave (IHEARTLA_OCTAVE=1; test/octave_engine.py)
octave = ["oct2py"]

[project.urls]
Homepage = "https://github.com/iheartla/iheartla"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iheartla*"]

[tool.setuptools.package-data]
# built-in I❤️MESH modules (.hlang) are read at compile time; the C++/MATLAB/Python
# support files are what generated code includes
iheartla = ["mesh/**/*", "pygments/*"]
