[project]
name = "iheartla"
version = "0.0.1"
description = "I❤️LA: Compilable Markdown for Linear Algebra"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yong Li", email = "pressure36@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    # The generated parsers in la_local_parsers need TatSu's regex-based
    # matching, which TatSu dropped after 5.7.3 (5.7.3 is yanked on PyPI but
    # installs fine when pinned exactly).
    "tatsu==5.7.3",
    "regex",
    "sympy",
    "appdirs",
]

[project.optional-dependencies]
gui = ["wxpython", "PyMuPDF"]
viz = ["graphviz"]
test = ["numpy", "scipy", "cppyy"]

[project.urls]
Homepage = "https://github.com/iheartla/iheartla"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iheartla*"]

[tool.setuptools.package-data]
# built-in I❤️MESH modules (.hlang) are read at compile time; the C++/MATLAB/Python
# support files are what generated code includes
iheartla = ["mesh/**/*", "pygments/*"]
