[package]
name = "iheartla"
version = "0.1.0"
edition = "2021"
description = "I❤️LA compiler (Rust port of the Python compiler)"
license = "MIT"

[lib]
path = "src/lib.rs"
# cdylib: the WebAssembly module for the web page (docs/update_rust_wasm.sh)
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "iheartla"
path = "src/main.rs"

[dependencies]
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
unicode_names2 = "1"

[profile.release]
debug = 1

# the WebAssembly module: small and fast (cargo build --profile wasm --target wasm32-unknown-unknown)
[profile.wasm]
inherits = "release"
debug = false
strip = true
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
